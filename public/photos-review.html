<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kstyles — Design Photo Selection</title>
<style>
  body { background:#0a0a0a; color:#fff; font-family:Segoe UI,Arial,sans-serif; margin:0; padding:32px 24px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:#a0a0a0; font-size:13px; margin:0 0 28px; }
  .bar { position:sticky; top:0; z-index:10; background:#0d0d0d; border:1px solid #2a2a2a; border-radius:10px; padding:14px 18px; margin-bottom:24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .bar .sel { color:#d4af37; font-weight:700; font-family:Consolas,monospace; font-size:14px; }
  .bar .hint { color:#a0a0a0; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; max-width:1500px; margin:0 auto; }
  .card { background:#111; border:2px solid #2a2a2a; border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color .15s; position:relative; }
  .card.selected { border-color:#d4af37; box-shadow:0 0 18px rgba(212,175,55,.25); }
  .badge { position:absolute; top:8px; left:8px; z-index:2; background:#d4af37; color:#000; font-weight:800; font-size:13px; padding:3px 9px; border-radius:6px; font-family:Consolas,monospace; }
  .card img { width:100%; height:260px; object-fit:cover; background:#000; display:block; }
  .meta { padding:10px 12px; display:flex; align-items:center; justify-content:space-between; }
  .name { font-size:11px; color:#a0a0a0; font-family:Consolas,monospace; }
  .check { font-size:12px; font-weight:700; }
  .card.selected .check { color:#d4af37; }
</style>
</head>
<body>
  <h1>Kstyles — Select the Designs</h1>
  <p class="sub">Click each photo to keep it (green = selected). The bar shows your selection — copy those numbers to chat.</p>
  <div class="bar">
    <span class="hint">Selected:</span>
    <span class="sel" id="sel">none</span>
    <button id="clear" style="background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;">Clear</button>
  </div>
  <div class="grid" id="grid"></div>
<script>
const selected = new Set();
const grid = document.getElementById("grid");
const sel = document.getElementById("sel");
const clear = document.getElementById("clear");
function renderBar() {
  const nums = [...selected].sort((a,b)=>a-b);
  sel.textContent = nums.length ? nums.join(", ") : "none";
}
clear.onclick = () => { selected.clear(); document.querySelectorAll(".card").forEach(c=>c.classList.remove("selected")); renderBar(); };
fetch("/api/designs/photos").then(r=>r.json()).then(list => {
  list.forEach((f, i) => {
    const num = i + 1;
    const card = document.createElement("div");
    card.className = "card";
    const img = document.createElement("img");
    img.src = "/images/designs/" + f;
    img.alt = f;
    img.loading = "lazy";
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = String(num).padStart(2, "0");
    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = f;
    const check = document.createElement("div");
    check.className = "check";
    check.textContent = "KEEP?";
    meta.append(name, check);
    card.append(badge, img, meta);
    card.onclick = () => {
      if (selected.has(num)) { selected.delete(num); card.classList.remove("selected"); check.textContent = "KEEP?"; }
      else { selected.add(num); card.classList.add("selected"); check.textContent = "KEEPING"; }
      renderBar();
    };
    grid.append(card);
  });
});
</script>
</body>
</html>
